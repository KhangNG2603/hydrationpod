# Topic-level Access Control List (RBAC) for Smart Hydration Pod

# ESP32 Medical Device: publish telemetry/ack/status, read control only
user esp32_hydropod_01
topic write smartbottle/HYDROPOD_01/telemetry
topic write smartbottle/HYDROPOD_01/ack
topic write smartbottle/HYDROPOD_01/status
topic read  smartbottle/HYDROPOD_01/control

# Python Gateway Bridge: read device telemetry/ack/status, write control
user server_bridge
topic read  smartbottle/+/telemetry
topic read  smartbottle/+/ack
topic read  smartbottle/+/status
topic write smartbottle/+/control

# Mobile Patient App: read telemetry, write limited control
user mobile_patient
topic read  smartbottle/HYDROPOD_01/telemetry
topic write smartbottle/HYDROPOD_01/control
