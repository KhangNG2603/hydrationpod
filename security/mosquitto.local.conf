# Mosquitto Local Broker (Native Host) - MQTT over TLS + Topic ACL + Audit Logging
per_listener_settings true

listener 8883
protocol mqtt
cafile security/certs/ca.crt
certfile security/certs/server.crt
keyfile security/certs/server.key
tls_version tlsv1.2
require_certificate false

allow_anonymous false
password_file security/passwd
acl_file security/acl.conf

log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_dest file security/logs/mosquitto.log
